# Project metadata

[project]
dynamic = ["version"]

name = "fsm2hdl"
description = "An Extensible Python Framework for Automated Generation of Synthesizable HDL Code for Finite State Machines"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

requires-python = ">=3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Code Generators",
]

dependencies = ["jinja2"]

[project.scripts]
fsm2hdl = "fsm2hdl.cli:main"

[project.urls]
"Source Code" = "https://github.com/drifter1/fsm2hdl"
"Bug Tracker" = "https://github.com/drifter1/fsm2hdl/issues"


# Build system configuration

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

# Hatch configuration

[tool.hatch.version]
path = "src/fsm2hdl/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fsm2hdl"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.test]
dependencies = ["pytest"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

# Ruff configuration

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "TID252", # Ignore relative-imports rule
    "S607", # Ignore partial executable path rule
]
